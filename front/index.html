<!DOCTYPE html>
<html lang="pt-br">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Red+Hat+Text:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style.css">
    <title>Cart</title>
</head>
<body>
    <main class="main">
        <div data-conteudo-produtos class="container-produtos">
            <h1 class="titulo">Cart</h1>

        </div>
        <div data-carrinho class="carrinho">
            <h2 class="titulo-cart">Your cart <span data-total-produtos></span></h2>
            <div data-cart-empty-img>
                <img  class="imagem-empty" src="./produtos/illustration-empty-cart.svg" alt="Imagem empty cart">
                <p class="paragrafo-cart-empty">Your added items will appear here</p>
            </div>
            <div data-none="block" data-product-cart class="data-conteudo-produtos">
               
            </div>
            <div data-none="flex" data-total-preco-compras class="total-soma-produtos">
                <p>Order Total</p>
                <h3 data-total class="total">$00</h3>
            </div>
            <div data-none='flex' class="card-message">
                <img src="./produtos/icon-carbon-neutral.svg" alt="Icone carbon neutral">
                <p>This a <b>carbon-neutral</b> delivery</p>
            </div>
            <button data-none="block" data-finalizar class="botao-cart-comprar">Confirm Order</button>
        </div>
    </main>
    <script type="module" src="./script.js"></script>
</body>
</html>
