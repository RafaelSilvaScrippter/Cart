<!DOCTYPE html>
<html lang="pt-br">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Red+Hat+Text:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style.css">
    <title>Cart</title>
</head>
<body>
    <main class="main">
        <div data-conteudo-produtos class="container-produtos">
            <h1 class="titulo">Cart</h1>

        </div>
        <div data-carrinho class="carrinho">
            <h2 class="titulo-cart">Your cart <span data-total-produtos>(9)</span></h2>
            <div class="data-conteudo-produtos">
                <p class="titulo-produto">Classic tiramissu</p>
                <div class="container-conteudo">
                    <div class="conteudo-cart">
                        <p data-quantidade class="quantidade">1x</p>
                        <p class="valor">@ $5.50</p>
                        <p class="total-cada">$5.50</p>
                    </div>
                    <div data-remover class="remover-produto">

                        <img src="./produtos/icon-remove-item.svg" alt="">
                    </div>
                </div>
            </div>
            <div data-total-preco-compras class="total-soma-produtos">
                <p>Order Total</p>
                <h3 class="total">$46.90</h3>
            </div>
            <div class="card-message">
                <img src="./produtos/icon-carbon-neutral.svg" alt="Icone carbon neutral">
                <p>This a <b>carbon-neutral</b> delivery</p>
            </div>
            <button data-finalizar class="botao-cart-comprar">Confirm Order</button>
        </div>
    </main>
    <script type="module" src="./script.js"></script>
</body>
</html>
